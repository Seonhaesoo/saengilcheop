name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 16 * * 0'   # 매주 월요일 01:30 KST — 오늘 기준 나이·새 날짜 페이지 갱신
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test
        run: node tools/test-school.mjs
      - name: Build site
        run: node tools/build.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
